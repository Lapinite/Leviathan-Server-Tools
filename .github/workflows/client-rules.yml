name: Client Rules plugin

on:
  push:
    paths:
      - 'plugins/client-rules/**'
      - '.github/workflows/client-rules.yml'
  pull_request:
    paths:
      - 'plugins/client-rules/**'
      - '.github/workflows/client-rules.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/client-rules
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B clean package
      - name: Upload plugin jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Leviathan-Client-Rules
          path: plugins/client-rules/target/Leviathan-Client-Rules-*.jar
          if-no-files-found: error
