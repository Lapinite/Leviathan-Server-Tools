<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020913"/><stop offset="1" stop-color="#061725"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="280" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="278" rx="21" fill="none" stroke="#173b51"/><text x="40" y="42" fill="#58eaff" font-family="ui-monospace,Consolas,monospace" font-size="14" letter-spacing="2.6">LEVIATHAN SERVER TOOLS // TOOL LIFECYCLE</text><text x="40" y="64" fill="#7899ac" font-family="Segoe UI,Arial" font-size="11">Public tooling moves through compatibility and security gates before supported release.</text><path id="p" d="M100 155 H1100" fill="none" stroke="#165d79" stroke-width="3"/><circle r="5" fill="#67f2ff" filter="url(#g)"><animateMotion dur="8s" repeatCount="indefinite"><mpath href="#p"/></animateMotion></circle><g font-family="Segoe UI,Arial" text-anchor="middle"><g transform="translate(115 155)"><circle r="34" fill="#061722" stroke="#4c6473"/><text y="4" fill="#eefcff" font-size="11">IDEA</text></g><g transform="translate(305 155)"><circle r="38" fill="#061722" stroke="#22bddb"/><text y="0" fill="#eefcff" font-size="10">PUBLIC-SAFE</text><text y="16" fill="#7898aa" font-size="9">design</text></g><g transform="translate(500 155)"><circle r="38" fill="#061722" stroke="#35e8f8"/><text y="0" fill="#eefcff" font-size="10">COMPATIBILITY</text><text y="16" fill="#7898aa" font-size="9">validation</text></g><g transform="translate(700 155)"><circle r="38" fill="#061722" stroke="#ff9f43"/><text y="0" fill="#eefcff" font-size="10">SECURITY</text><text y="16" fill="#7898aa" font-size="9">review</text></g><g transform="translate(900 155)"><circle r="38" fill="#061722" stroke="#8174ff"/><text y="0" fill="#eefcff" font-size="10">DOCUMENTED</text><text y="16" fill="#7898aa" font-size="9">public tool</text></g><g transform="translate(1080 155)"><circle r="38" fill="#061722" stroke="#43d9a3"/><text y="0" fill="#eefcff" font-size="10">VERSIONED</text><text y="16" fill="#7898aa" font-size="9">support</text></g></g><text x="600" y="235" text-anchor="middle" fill="#66899c" font-family="ui-monospace,Consolas,monospace" font-size="9">SUPPORT CLAIMS FOLLOW INSTALLATION, COMPATIBILITY, SECURITY AND FAILURE-BEHAVIOR VALIDATION</text></svg>